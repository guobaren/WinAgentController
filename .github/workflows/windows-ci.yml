name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Rc.RemoteController.sln -p:NuGetAudit=false
      - name: Build
        run: dotnet build Rc.RemoteController.sln --no-restore -warnaserror
      - name: Test
        # 云端 runner 上 TaskHost 时序/输出段竞争类测试偶发失败（本地稳定，见 docs/审计.md Known Issues）；
        # 失败后整体重试一次，避免 flaky 阻塞 CI 门禁；连续两次失败仍判红。
        run: |
          dotnet test Rc.RemoteController.sln --no-build --no-restore -v minimal -p:NuGetAudit=false || dotnet test Rc.RemoteController.sln --no-build --no-restore -v minimal -p:NuGetAudit=false
      - name: Publish self-contained Windows x64 artifacts
        shell: powershell
        run: ./scripts/Publish-RemoteController.ps1 -OutputPath artifacts/publish
      - name: Verify installer payload
        shell: powershell
        run: |
          $required = 'Rc.Agent.exe', 'Rc.PrivilegedBroker.exe', 'Rc.TaskHost.exe', 'Rc.UiAgent.exe', 'Rc.Cli.exe', 'Install-RemoteController.ps1', 'Update-RemoteController.ps1', 'Uninstall-RemoteController.ps1', 'Start-RemoteController.cmd'
          foreach ($file in $required) { if (-not (Test-Path "artifacts/publish/$file" -PathType Leaf)) { throw "Missing $file" } }
      # 不上传 artifact：完整包约 690 MB，会迅速耗尽 Actions 存储配额；
      # 正式分发由 tag 触发的 release.yml 发布到 GitHub Release，CI 仅做构建与测试门禁。
